name: Backend Tests & Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: brickwest_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Lint
        working-directory: backend
        run: npm run lint

      # The API tests create the schema themselves, exactly as the server does
      # on startup, so the database starts empty here.
      - name: Run tests
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: brickwest_test
          NODE_ENV: test
          JWT_SECRET: ci-only-secret-for-tests
        run: npm test

      - name: Boot the server and smoke test it
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: brickwest_test
          JWT_SECRET: ci-only-secret-for-tests
          PORT: 3001
        run: |
          node src/index.js &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3001/health > /dev/null && break
            sleep 1
          done
          BASE_URL=http://localhost:3001 npm run smoke
          # A clean exit here proves graceful shutdown works.
          kill -TERM "$SERVER_PID"
          wait "$SERVER_PID"

  # Verifies the production image still builds. Nothing is pushed: Railway
  # builds and deploys straight from the repository.
  docker-build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./docker/Dockerfile.backend
          push: false
